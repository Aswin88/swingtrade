name: Daily swing scan

on:
  schedule:
    # NSE closes 15:30 IST (10:00 UTC). Run Mon-Fri at 16:00 IST (10:30 UTC).
    - cron: "30 10 * * 1-5"
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit results back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest and scanner
        run: python swing_backtest.py | tee run_log.txt

      - name: Upload results as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: swing-results
          path: |
            trades.csv
            signals_today.csv
            equity_R.png
            run_log.txt
          if-no-files-found: ignore

      - name: Commit results to repo
        run: |
          mkdir -p results
          cp -f trades.csv signals_today.csv equity_R.png run_log.txt results/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if ! git diff --cached --quiet; then
            git commit -m "Daily scan $(date -u +%F)"
            git push
          fi
